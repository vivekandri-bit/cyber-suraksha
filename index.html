<title>Cyber Suraksha Challenge</title>
<meta name="referrer" content="strict-origin-when-cross-origin">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Mukta:wght@400;500;700&display=swap">
<style>
/* Layout: one-column phone app, sticky title bar, content cards styled as the real channel (SMS / WhatsApp / call / e-mail), fixed bottom tab bar */
:root{
  --bg:#F3F5F9; --surface:#FFFFFF; --ink:#16243A; --muted:#5B6A80; --line:#D9DFE8;
  --navy:#1F3A5F; --saffron:#E46C0A; --saffron-soft:#FCE9DA;
  --scam:#C62828; --scam-soft:#FDE7E7; --safe:#2E7D32; --safe-soft:#E3F2E4;
  --sms:#E9EDF3; --wa:#DCF3D9; --wa-head:#2C6B4F; --call:#1B2638; --call-ink:#EAF0F8;
  --on-navy:#FFFFFF; --band:#FFFFFF; --band-ink:#1F3A5F; --band-sub:#5B6A80;
  --f-display:"Baloo 2","Mukta",system-ui,sans-serif;
  --f-body:"Mukta","Noto Sans Devanagari",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F1622; --surface:#18212F; --ink:#E7ECF3; --muted:#9AA8BC; --line:#2A3547;
  --navy:#1A2D47; --saffron:#F08A3A; --saffron-soft:#3A2717;
  --scam:#FF7B7B; --scam-soft:#3A1C1F; --safe:#7FCB84; --safe-soft:#18301B;
  --sms:#222D3E; --wa:#1E3A2B; --wa-head:#6FC29B; --call:#0B111B; --call-ink:#EAF0F8; --on-navy:#FFFFFF; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1622; --surface:#18212F; --ink:#E7ECF3; --muted:#9AA8BC; --line:#2A3547;
  --navy:#1A2D47; --saffron:#F08A3A; --saffron-soft:#3A2717;
  --scam:#FF7B7B; --scam-soft:#3A1C1F; --safe:#7FCB84; --safe-soft:#18301B;
  --sms:#222D3E; --wa:#1E3A2B; --wa-head:#6FC29B; --call:#0B111B; --call-ink:#EAF0F8; --on-navy:#FFFFFF; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg)}
html{font-size:112.5%}
body{color:var(--ink);font-family:var(--f-body);font-size:1rem;line-height:1.5;margin:0}
button{font:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--saffron);outline-offset:2px}
.top{background:var(--navy);color:var(--on-navy)}
.idband{background:var(--band);border-bottom:4px solid var(--saffron);padding:10px 16px}
.idband-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:56px 1fr 76px;align-items:center;gap:8px}
.idband img{display:block;width:100%;height:auto}
.idband .ndri-logo{justify-self:end}
.title{text-align:center;min-width:0}
.title b{display:block;font-family:var(--f-display);font-weight:800;color:var(--band-ink);font-size:clamp(20px,6vw,34px);line-height:1.02;letter-spacing:.2px;text-wrap:balance}
.title .l1,.title .l2{display:block;white-space:nowrap}
.title .l2{color:var(--saffron);font-size:.82em;letter-spacing:.06em;text-transform:uppercase}
.title .inst{display:block;color:var(--band-sub);font-size:13px;font-weight:500;margin-top:3px;line-height:1.25}
.ctrl{padding:7px 16px}
.ctrl-in{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:10px}
.ctrl-in small{flex:1;min-width:0;opacity:.9;font-size:.78rem;line-height:1.3}
.tsize{flex:none;background:transparent;color:var(--on-navy);border:1px solid rgba(255,255,255,.45);border-radius:20px;padding:4px 10px;font-weight:700}
.cats{display:flex;flex-wrap:wrap;gap:8px}
.cat{border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:20px;padding:5px 12px;font-size:.85rem}
.cat[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff}
.lang{display:flex;border:1px solid rgba(255,255,255,.45);border-radius:20px;overflow:hidden;flex:none}
.lang button{background:transparent;color:var(--on-navy);border:0;padding:4px 12px;font-size:.85rem}
.lang button[aria-pressed="true"]{background:var(--saffron);color:#fff}
main{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:16px 110px}
h1{font-family:var(--f-display);font-size:1.6rem;line-height:1.15;margin:0 0 4px;text-wrap:balance}
h2{font-family:var(--f-display);font-size:1.2rem;margin:0 0 8px;text-wrap:balance}
.lede{color:var(--muted);margin:0 0 14px}
.panel{display:flex;flex-direction:column;gap:14px}
.meter{display:flex;align-items:center;gap:10px;font-variant-numeric:tabular-nums;font-size:.9rem;color:var(--muted)}
.bar{flex:1;height:8px;background:var(--line);border-radius:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--saffron);width:0;transition:width .3s}
.chip{display:inline-block;font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;font-weight:700;color:var(--saffron);background:var(--saffron-soft);padding:2px 8px;border-radius:10px}
/* message renderings */
.msg{border-radius:16px;overflow:hidden;border:1px solid var(--line);background:var(--surface)}
.msg .hd{display:flex;align-items:center;gap:10px;padding:10px 14px;font-size:.88rem;border-bottom:1px solid var(--line)}
.av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:.8rem;flex:none;background:var(--line);color:var(--ink)}
.hd .who{min-width:0}
.hd .who b{display:block;overflow-wrap:anywhere}
.hd .who span{color:var(--muted);font-size:.78rem}
.bd{padding:14px}
.bubble{font-size:1.06rem;background:var(--sms);border-radius:4px 16px 16px 16px;padding:10px 12px;max-width:94%;overflow-wrap:anywhere;white-space:pre-line}
.msg.wa .hd{background:var(--wa-head);color:#fff;border:0}
.msg.wa .hd .who span{color:rgba(255,255,255,.85)}
.msg.wa .bd{background:repeating-linear-gradient(45deg,transparent 0 10px,rgba(127,127,127,.05) 10px 20px)}
.msg.wa .bubble{background:var(--wa)}
.att{margin-top:8px;display:flex;gap:8px;align-items:center;background:var(--surface);border:1px dashed var(--muted);border-radius:10px;padding:8px 10px;font-size:.85rem;overflow-wrap:anywhere}
.att .ext{font-weight:700;color:var(--scam);flex:none}
.msg.call{background:var(--call);color:var(--call-ink);border:0}
.msg.call .hd{border:0;justify-content:center;flex-direction:column;text-align:center;padding-top:18px}
.msg.call .hd .who span{color:#9FB0C7}
.msg.call .av{width:56px;height:56px;font-size:1.1rem;background:#2C3B54;color:#fff}
.msg.call .bubble{background:#25324A;color:var(--call-ink);border-radius:12px}
.callbtns{display:flex;justify-content:center;gap:40px;padding:4px 0 16px}
.callbtns span{width:42px;height:42px;border-radius:50%;display:block}
.callbtns .r{background:#D93A3A}.callbtns .g{background:#2FA35A}
.msg.mail .hd{flex-direction:column;align-items:flex-start;gap:2px}
.msg.mail .hd div{overflow-wrap:anywhere}
.msg.mail .bubble{background:transparent;padding:0;max-width:100%}
.lbl{color:var(--muted);font-size:.78rem}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{border:2px solid transparent;border-radius:14px;padding:12px;font-weight:700;font-size:1rem}
.btn-scam{background:var(--scam-soft);color:var(--scam);border-color:var(--scam)}
.btn-safe{background:var(--safe-soft);color:var(--safe);border-color:var(--safe)}
.btn-main{background:var(--saffron);color:#fff;width:100%}
.btn-ghost{background:transparent;border-color:var(--line);color:var(--ink)}
.btn:disabled{opacity:.45;cursor:default}
.verdict{border-radius:14px;padding:14px;border:1px solid var(--line);background:var(--surface)}
.verdict.ok{border-left:6px solid var(--safe)}
.verdict.no{border-left:6px solid var(--scam)}
.verdict h3{margin:0 0 6px;font-family:var(--f-display);font-size:1.1rem}
.verdict ul{margin:6px 0 8px;padding-left:20px}
.verdict p{margin:0}
.vbox{position:relative;width:100%;max-width:100%;aspect-ratio:16/9;border-radius:12px;overflow:hidden;background:var(--call);margin-top:10px}
.vbox iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.vplay{position:absolute;inset:0;width:100%;height:100%;border:0;padding:0;background:var(--call);color:#fff;display:grid;place-items:center}
.vplay img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.85}
.vplay .pbtn{position:relative;width:64px;height:46px;border-radius:12px;background:#D93A3A;display:grid;place-items:center;box-shadow:0 2px 10px rgba(0,0,0,.35)}
.vplay .pbtn::after{content:"";border-left:18px solid #fff;border-top:11px solid transparent;border-bottom:11px solid transparent;margin-left:4px}
.vplay .vlbl{position:absolute;left:10px;bottom:8px;background:rgba(0,0,0,.6);padding:2px 8px;border-radius:8px;font-size:.8rem}
.vlink{display:block;margin-top:8px;font-size:.88rem;font-weight:700;overflow-wrap:anywhere;color:var(--saffron);text-decoration:underline}
.vlist{display:flex;flex-direction:column;gap:14px}
.tag{font-weight:700}
.tag.scam{color:var(--scam)}.tag.safe{color:var(--safe)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:10px 12px;font-family:ui-monospace,"SFMono-Regular",Menlo,monospace;font-size:.9rem;overflow-wrap:anywhere;color:var(--ink)}
.opt.right{border-color:var(--safe);background:var(--safe-soft)}
.opt.wrong{border-color:var(--scam);background:var(--scam-soft)}
input[type=text],input[type=password]{width:100%;font:inherit;padding:12px;border-radius:12px;border:2px solid var(--line);background:var(--surface);color:var(--ink)}
.strength{height:10px;border-radius:10px;background:var(--line);overflow:hidden}
.strength i{display:block;height:100%;width:0;transition:width .25s,background .25s}
.row{display:flex;gap:10px;align-items:flex-start}
.check{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
.check:last-child{border-bottom:0}
.check input{width:22px;height:22px;margin-top:2px;accent-color:var(--safe);flex:none}
.big{font-family:var(--f-display);font-size:2.4rem;line-height:1;font-variant-numeric:tabular-nums}
.steps{counter-reset:s;list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:10px}
.steps li{counter-increment:s;display:flex;gap:12px;align-items:flex-start}
.steps li::before{content:counter(s);flex:none;width:28px;height:28px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font-weight:700;font-size:.9rem}
.hotline{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--scam-soft);border:2px solid var(--scam);border-radius:14px;padding:12px 14px}
.hotline .num{font-family:var(--f-display);font-size:2rem;color:var(--scam);line-height:1}
.copy{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:6px 10px;font-size:.85rem}
a{color:var(--saffron)}
.contact{font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.pledge{background:var(--navy);color:#fff;border-radius:16px;padding:16px}
.pledge p{margin:0 0 12px}
.done-msg{font-weight:700}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs-in{max-width:600px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr)}
.tabs button{background:none;border:0;padding:8px 1px 10px;color:var(--muted);font-size:12px;min-width:0;line-height:1.2;display:flex;flex-direction:column;align-items:center;gap:3px;border-top:3px solid transparent}
.tabs button[aria-selected="true"]{color:var(--saffron);border-top-color:var(--saffron);font-weight:700}
.tabs button span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.tabs svg{width:22px;height:22px}
.foot{color:var(--muted);font-size:.8rem;text-align:center;margin-top:8px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<main>
  <!-- 1. SPOT THE SCAM -->
  <section id="p-scam" class="panel" data-panel>
    <div>
      <span class="chip" data-t="act1"></span>
      <h1 data-t="scamTitle"></h1>
      <p class="lede" data-t="scamLede"></p>
    </div>
    <div><div class="lbl" data-t="pickTheme" style="margin-bottom:6px"></div><div class="cats" id="q-cats" role="group"></div></div>
    <div class="meter"><span id="q-pos"></span><div class="bar"><i id="q-bar"></i></div><span id="q-score"></span></div>
    <div id="q-card"></div>
    <div class="choices" id="q-choices">
      <button class="btn btn-scam" id="b-scam" type="button" data-t="isScam"></button>
      <button class="btn btn-safe" id="b-safe" type="button" data-t="isSafe"></button>
    </div>
    <div id="q-verdict"></div>
    <button class="btn btn-main" id="q-next" type="button" hidden></button>
  </section>

  <!-- 2. LINK DETECTIVE -->
  <section id="p-link" class="panel" data-panel hidden>
    <div>
      <span class="chip" data-t="act2"></span>
      <h1 data-t="linkTitle"></h1>
      <p class="lede" data-t="linkLede"></p>
    </div>
    <div class="card"><b data-t="ruleHead"></b><p style="margin:4px 0 0" data-t="ruleBody"></p></div>
    <div class="meter"><span id="l-pos"></span><div class="bar"><i id="l-bar"></i></div><span id="l-score"></span></div>
    <div class="card"><h2 id="l-q"></h2><div class="opts" id="l-opts"></div></div>
    <div id="l-verdict"></div>
    <button class="btn btn-main" id="l-next" type="button" hidden></button>
  </section>

  <!-- 3. PASSWORD -->
  <section id="p-pass" class="panel" data-panel hidden>
    <div>
      <span class="chip" data-t="act3"></span>
      <h1 data-t="passTitle"></h1>
      <p class="lede" data-t="passLede"></p>
    </div>
    <div class="card panel">
      <label for="pw" class="lbl" data-t="passLabel"></label>
      <input id="pw" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" value="Ndri@123">
      <div class="strength"><i id="pw-bar"></i></div>
      <div><b id="pw-label"></b> <span class="lbl" id="pw-time"></span></div>
      <ul id="pw-tips" style="margin:0;padding-left:20px"></ul>
    </div>
    <div class="card"><b data-t="passIdeaHead"></b><p style="margin:4px 0 0" data-t="passIdea"></p></div>
  </section>

  <!-- 4. CHECK-UP -->
  <section id="p-check" class="panel" data-panel hidden>
    <div>
      <span class="chip" data-t="act4"></span>
      <h1 data-t="checkTitle"></h1>
      <p class="lede" data-t="checkLede"></p>
    </div>
    <div class="card row" style="align-items:center">
      <div class="big"><span id="c-score">0</span><span style="font-size:1.2rem;color:var(--muted)">/<span id="c-total"></span></span></div>
      <div id="c-msg" style="min-width:0"></div>
    </div>
    <div class="card" id="c-list"></div>
  </section>

  <!-- 5. HELP -->
  <section id="p-help" class="panel" data-panel hidden>

       hi:"“आपके नाम के पार्सल में ड्रग्स और नकली पासपोर्ट ज़ब्त हुए हैं। आपका आधार मनी लॉन्ड्रिंग से जुड़ा है। आप डिजिटल अरेस्ट में हैं। कॉल न काटें और किसी को न बताएँ। अपनी जमा-पूँजी इस RBI सत्यापन खाते में भेजें। जाँच के बाद लौटा दी जाएगी।”"},
 ans:"scam",
 flags:{en:["There is no “digital arrest” in Indian law","Police and CBI never question people or demand money on video calls","Isolation: “don't disconnect, don't tell anyone”"],
        hi:["भारतीय कानून में “डिजिटल अरेस्ट” जैसा कुछ नहीं है","पुलिस या सीबीआई वीडियो कॉल पर पूछताछ नहीं करती और पैसे नहीं माँगती","अकेला करना: “कॉल न काटें, किसी को न बताएँ”"]},
 tip:{en:"Disconnect immediately, tell your family, and call 1930. Real agencies send written notices and never ask you to transfer money.",
      hi:"तुरंत कॉल काटें, परिवार को बताएँ और 1930 पर कॉल करें। असली एजेंसियाँ लिखित नोटिस भेजती हैं और कभी पैसे ट्रांसफ़र करने को नहीं कहतीं।"}},
{ch:"wa",av:"AO",from:{en:"“Capt. Sharma (Buyer)”",hi:"“कैप्टन शर्मा (खरीदार)”"},sub:{en:"From an online marketplace ad",hi:"ऑनलाइन बिक्री विज्ञापन से"},
 body:{en:"Sir I am Army officer posted in cantt, I will buy your scooter for ₹45,000. I am sending advance now. Scan this QR code and enter your UPI PIN to RECEIVE ₹5,000.",
       hi:"सर मैं छावनी में तैनात आर्मी अफ़सर हूँ, आपका स्कूटर ₹45,000 में लूँगा। अभी एडवांस भेज रहा हूँ। ₹5,000 प्राप्त करने के लिए यह QR कोड स्कैन करें और UPI PIN डालें।"},
 att:{name:"QR_code_receive_payment.jpg",size:"84 KB",ext:"QR"},ans:"scam",

        hi:["पैसा प्राप्त करने के लिए PIN या QR स्कैन की कभी ज़रूरत नहीं होती","भरोसा जीतने के लिए नकली “आर्मी अफ़सर” की कहानी","सोचने से पहले जल्दबाज़ी करवाना"]},
 tip:{en:"UPI PIN is only for SENDING money. Scanning a QR and entering your PIN always takes money out of your account.",

{ch:"sms",av:"63",from:{en:"+91 63xxxxxx18",hi:"+91 63xxxxxx18"},sub:{en:"Text message",hi:"एसएमएस"},

       hi:"प्रिय ग्राहक, आपका बैंक KYC समाप्त हो गया है। 24 घंटे में आपका खाता बंद कर दिया जाएगा। अभी PAN/KYC अपडेट करें: http://kyc-update-bank.in/verify"},

{ch:"wa",av:"HR",from:{en:"“Priya – HR, Digital Marketing”",hi:"“प्रिया – एचआर, डिजिटल मार्केटिंग”"},sub:{en:"Not in your contacts",hi:"आपके संपर्कों में नहीं"},

{ch:"mail",av:"CC",from:{en:"Cyber Security Cell, NDRI",hi:"साइबर सुरक्षा प्रकोष्ठ, रा.डे.अनु.सं."},sub:{en:"Official ICAR e-mail address",hi:"आधिकारिक आईसीएआर ई-मेल पता"},

{ch:"mail",av:"D",from:{en:"Director NDRI <director.ndri.office@gmail.com>",hi:"Director NDRI <director.ndri.office@gmail.com>"},sub:{en:"To: you",hi:"प्रति: आप"},

/* ---------- Spot the scam ---------- */
let qi=0,qs=0,qAnswered=false,qDone=false;
function renderQ(){
  $("q-pos").textContent=qDone?"":`${Math.min(qi+1,Q.length)} ${t("of")} ${Q.length}`;
  $("q-score").textContent=`${t("score")}: ${qs}`;
  $("q-bar").style.width=((qDone?Q.length:qi)/Q.length*100)+"%";
  const nx=$("q-next");
  if(qDone){
    $("q-choices").hidden=true;
    const pct=qs/Q.length;
    const msg=pct>=.85?t("resultHi"):pct>=.6?t("resultMid"):t("resultLo");
    $("q-card").innerHTML=`<div class="card" style="text-align:center"><div class="lbl">${t("resultHead")}</div><div class="big">${qs}<span style="font-size:1.2rem;color:var(--muted)">/${Q.length}</span></div><p style="margin:8px 0 0">${msg}</p></div>`;
    $("q-verdict").innerHTML="";nx.hidden=false;nx.textContent=t("restart");return;
  }
  const q=Q[qi];
  let hd,bd;
  const body=`<div class="bubble">${esc(q.body[lang])}${q.att?`<div class="att"><span class="ext">${q.att.ext}</span><span>${esc(q.att.name)} · ${q.att.size}</span></div>`:""}</div>`;
  if(q.ch==="mail"){
    hd=`<div class="hd"><div><span class="lbl">From</span> <b>${esc(q.from[lang])}</b></div><div class="lbl">${esc(q.sub[lang])}</div><div><b>${esc(q.subject[lang])}</b></div></div>`;
  }else{
    hd=`<div class="hd"><div class="av">${esc(q.av)}</div><div class="who"><b>${esc(q.from[lang])}</b><span>${esc(q.sub[lang])}</span></div></div>`;
  }
  bd=`<div class="bd">${body}</div>`;
  const extra=q.ch==="call"?`<div class="callbtns" aria-hidden="true"><span class="r"></span><span class="g"></span></div>`:"";
  $("q-card").innerHTML=`<article class="msg ${q.ch}">${hd}${bd}${extra}</article>`;
  $("q-choices").hidden=false;
  $("b-scam").disabled=qAnswered;$("b-safe").disabled=qAnswered;
  if(qAnswered)showVerdict(); else $("q-verdict").innerHTML="";
  nx.hidden=!qAnswered;nx.textContent=qi===Q.length-1?t("finish"):t("next");
}
let lastPick=null;
function showVerdict(){
  const q=Q[qi],ok=lastPick===q.ans;
  $("q-verdict").innerHTML=`<div class="verdict ${ok?"ok":"no"}"><h3>${ok?t("correct"):t("wrong")} ${t("itWas")} <span class="tag ${q.ans}">${q.ans==="scam"?t("scamW"):t("safeW")}</span></h3>
  <b>${q.ans==="scam"?t("flagsScam"):t("flagsSafe")}</b><ul>${q.flags[lang].map(f=>`<li>${esc(f)}</li>`).join("")}</ul>
  <b>${t("doThis")}</b><p>${esc(q.tip[lang])}</p>${q.vid!==undefined?`<div style="margin-top:10px"><b>${t("watchVideo")}</b>${vidHTML(q.vid)}</div>`:""}</div>`;
}
function pick(a){if(qAnswered)return;qAnswered=true;lastPick=a;if(a===Q[qi].ans)qs++;renderQ();$("q-verdict").scrollIntoView({behavior:"smooth",block:"nearest"})}
$("b-scam").onclick=()=>pick("scam");$("b-safe").onclick=()=>pick("safe");
$("q-next").onclick=()=>{
  if(qDone){qi=0;qs=0;qDone=false;qAnswered=false;}
  else if(qi===Q.length-1){qDone=true;}
  else{qi++;qAnswered=false;}
  renderQ();window.scrollTo({top:0,behavior:"smooth"});
};

function renderL(){

  $("l-score").textContent=`${t("score")}: ${ls}`;
  $("l-bar").style.width=((lDone?L.length:li)/L.length*100)+"%";

/* ---------- Password ---------- */
const COMMON=["password","passw","123","qwerty","ndri","icar","india","karnal","admin","welcome","abc","iloveyou","krishna","ganesh","sairam","love"];
function evalPw(p){
  let pool=0;if(/[a-z]/.test(p))pool+=26;if(/[A-Z]/.test(p))pool+=26;if(/\d/.test(p))pool+=10;if(/[^A-Za-z0-9]/.test(p))pool+=33;
  let bits=p.length?p.length*Math.log2(Math.max(pool,1)):0;
  const low=p.toLowerCase();const common=COMMON.some(w=>low.includes(w))||/(19|20)\d\d/.test(p);
  const rep=/(.)\1\1/.test(p)||/(0123|1234|2345|3456|4567|5678|6789|abcd|qwer|asdf)/i.test(p);
  if(common)bits-=22;if(rep)bits-=12;bits=Math.max(0,bits);
  const lvl=bits<28?0:bits<40?1:bits<60?2:bits<80?3:4;
  const tips=[];if(p.length<12)tips.push(t("tipLen"));if(pool<60)tips.push(t("tipMix"));if(common)tips.push(t("tipCommon"));if(rep)tips.push(t("tipRepeat"));if(!tips.length)tips.push(t("tipGood"));
  return{lvl,tips};
}
function renderPw(){
  const p=$("pw").value,{lvl,tips}=evalPw(p);
  const labels=["pwVeryWeak","pwWeak","pwFair","pwStrong","pwVeryStrong"],times=["pwT0","pwT1","pwT2","pwT3","pwT4"];
  const cols=["var(--scam)","var(--scam)","var(--saffron)","var(--safe)","var(--safe)"];
  $("pw-bar").style.width=p?((lvl+1)*20)+"%":"0";$("pw-bar").style.background=cols[lvl];
  $("pw-label").textContent=p?t(labels[lvl]):"";$("pw-label").style.color=cols[lvl];
  $("pw-time").textContent=p?"· "+t(times[lvl]):"";
  $("pw-tips").innerHTML=p?tips.map(x=>`<li>${esc(x)}</li>`).join(""):"";
}
$("pw").addEventListener("input",renderPw);

  $("c-total").textContent=C.en.length;

  $("c-list").querySelectorAll("input").forEach((el,i)=>el.onchange=()=>{cState[i]=el.checked;scoreC()});
